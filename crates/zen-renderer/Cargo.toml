[package]
name = "zen-renderer"
version = "0.1.0"
edition.workspace = true
publish = false
description = "GPU-driven renderer with explicit frame composition and Mesh-domain stages"
readme = "README.md"

[features]
default = []
snapshot = ["zen-frame-graph/snapshot"]

[dependencies]
zen-frame-graph = { path = "../zen-frame-graph" }
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true

[dev-dependencies]
wgpu = { workspace = true, features = ["noop"] }
