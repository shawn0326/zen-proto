[package]
name = "zen-frame-graph"
version = "0.1.0"
edition.workspace = true
publish = false
description = "A FrameGraph compiler and transient-resource executor for wgpu"
repository = "https://github.com/shawn0326/zen-proto"
readme = "README.md"
keywords = ["wgpu", "framegraph", "rendering", "graphics"]
categories = ["graphics", "rendering"]

[features]
default = []
serde = ["dep:serde", "wgpu/serde"]
snapshot = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
wgpu.workspace = true

[dev-dependencies]
proptest = "1"
serde_json.workspace = true
trybuild = "1"
wgpu = { workspace = true, features = ["noop"] }

[[example]]
name = "compile-bench"
path = "examples/compile_bench.rs"

[[example]]
name = "pool-bench"
path = "examples/pool_bench.rs"
