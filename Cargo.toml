[workspace]
resolver = "3"
members = [
    "crates/zen-frame-graph",
    "crates/zen-render",
    "crates/zen-render-mesh",
    "apps/zen-demo",
]
default-members = [
    "crates/zen-frame-graph",
    "crates/zen-render",
    "crates/zen-render-mesh",
]
exclude = ["third_party/wgpu-hal-30.0.1"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
wgpu = "30.0.1"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1.24", features = ["derive"] }
winit = "0.30"
pollster = "0.4"
rand = "0.9"
image = "0.25"
gltf = { version = "1", features = ["KHR_texture_transform"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# wgpu-hal 30.0.1 omits VK_EXT_mesh_shader stages from Vulkan resource barriers. Keep the
# renderer on wgpu's public API while carrying the minimal synchronization fix locally until the
# upstream crate includes it. See third_party/wgpu-hal-30.0.1/README.zen.md.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal-30.0.1" }
